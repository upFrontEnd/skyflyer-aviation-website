<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyflyer Aviation</title>
    <!--
      Script synchrone, exécuté avant le CSS et avant Vue : pose data-theme
      sur <html> dès que possible pour éviter un flash du thème clair avant
      que main.js (chargé en module, donc différé) ne monte l'app et que
      Header.vue applique le thème persisté. Header.vue reprend ensuite la
      main pour les changements suivants (clic sur le bouton, sauvegarde).
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <meta
      name="description"
      content="Skyflyer Aviation - Simulation de vol, ensemble vers plus de réalisme."
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
